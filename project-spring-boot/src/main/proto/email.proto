syntax = "proto3";

package email;

service EmailService {
  rpc SendVerificationEmail(VerificationEmailRequest) returns (EmailResponse);
  rpc SendReportEmail(ReportEmailRequest) returns (EmailResponse);
  rpc GetEmailStatus(EmailStatusRequest) returns (EmailStatusResponse);
}

message VerificationEmailRequest {
  string to = 1;
  string username = 2;
  string verificationCode = 3;
  string verificationLink = 4;
}

message ReportEmailRequest {
  string to = 1;
  string username = 2;
  string reportTitle = 3;
  string reportContent = 4;
  string reportDate = 5;
  repeated ReportData reportData = 6;
}

message ReportData {
  string key = 1;
  string value = 2;
}

message EmailResponse {
  bool success = 1;
  string message = 2;
  string emailId = 3;
}

message EmailStatusRequest {
  string emailId = 1;
}

message EmailStatusResponse {
  bool sent = 1;
  bool opened = 2;
  string openedAt = 3;
  int32 openCount = 4;
}

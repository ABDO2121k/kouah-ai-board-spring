spring.application.name=project

# Datasource - defaults to localhost for manual runs, Docker compose overrides these
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kouahai_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kouahai_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kouahai_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server port (matches docker mapping 8080:8080)
server.port=8080

# MinIO settings - defaults to localhost for manual runs, Docker compose overrides these
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# gRPC Email Service Configuration - defaults to localhost for manual runs
email.service.host=${EMAIL_SERVICE_HOST:localhost}
email.service.port=${EMAIL_SERVICE_PORT:50051}

# Email Verification Settings
app.email.verification.url=${APP_URL:http://localhost:8080}/api/auth/verify

# Redis Cache Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

version: "3.8"

services:
  # Spring Boot application
  spring-app:
    build: ./project-spring-boot
    container_name: spring-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/kouahai_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=kouahai_user
      - SPRING_DATASOURCE_PASSWORD=kouahai_password
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - EMAIL_SERVICE_HOST=email-service
      - EMAIL_SERVICE_PORT=50051
      - APP_URL=${APP_URL:-http://localhost:8080}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      - mysql
      - minio
      - redis
      - rabbitmq
      - email-service
    networks:
      - app-network
      - email-network
    volumes:
      - app-logs:/var/log/project

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=kouahai_db
      - MYSQL_USER=kouahai_user
      - MYSQL_PASSWORD=kouahai_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password

  # Minio for object storage (images)
  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - app-network
    command: server /data --console-address ":9001"

  # Create default bucket on minio startup
  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      - minio
    networks:
      - app-network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/images --ignore-existing;
      /usr/bin/mc anonymous set download myminio/images;
      exit 0;
      "

  # MongoDB for email service
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=email_service
    volumes:
      - mongodb-data:/data/db
    networks:
      - email-network
    ports:
      - "27017:27017"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WebSocket Notification Service
  notification-service:
    build: ./ws-notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - NOTIFICATION_QUEUE=notification.queue
      - NOTIFICATION_EXCHANGE=notification.exchange
      - CORS_ORIGIN=*
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - notification-logs:/app/logs

  # Email Service (Private - gRPC only)
  email-service:
    build: ./email-service
    container_name: email-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HTTP_PORT=3000
      - GRPC_PORT=50051
      - MONGODB_URI=mongodb://mongodb:27017/email_service
      - SERVICE_URL=http://email-service:3000
      # SMTP Configuration from .env file
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Agile Project Management}
    depends_on:
      - mongodb
    networks:
      - email-network
    volumes:
      - email-logs:/app/logs

networks:
  app-network:
    driver: bridge
  email-network:
    driver: bridge
    internal: false

volumes:
  app-logs:
  mysql-data:
  minio-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  notification-logs:
  email-logs:
